# Example DAI Transfer indexer. Replace address/ABI/startBlock for your contract.
# startBlock: 1 is a PLACEHOLDER — use the deployment block from AnubisScan in production.
specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Dai
    network: anubis
    source:
      address: "0x83fd06F0846d9D90B3016bF670Efe2E0B11cDe14"
      abi: ERC20
      startBlock: 1
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Transfer
      abis:
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/mapping.ts
